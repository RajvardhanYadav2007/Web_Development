<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display-Inline</title>
    <style>
        .box, .Container{
            display: inline;
            background-color: rgb(165, 42, 161);
            margin: 20px;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="box">Inline</div>
    <div class="box">Internal</div>
    <div class="Container">External</div>
</body>

</html>
