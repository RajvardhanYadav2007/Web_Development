<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display-Block</title>
    <style>
        .box, .Container{
            display: block;
            height: 50px;
            width: 100px;
            background-color: rgb(139, 79, 46);
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>

<body>
    <H1>TYPES OF CSS</H1>
    <div class="box">INLINE</div>
    <div class="box">ENTERNAL</div>
    <div class="Container"> EXTERNAL </div>
</body>

</html>
