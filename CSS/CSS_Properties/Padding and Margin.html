<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Padding And Margin</title>

    <style>
        section {
            border: 2px solid green;

            /* Padding: 20px; */

            /* Padding individual sides */
            /* padding-top: 20px;
               padding-right: 30px;
               padding-bottom: 40px;
               padding-left: 50px; */

            padding: 20px;
            margin: 20px;
        }

        div {
            border: 2px solid red;
            padding: 10px;
        }

        p {
            border: 2px solid brown;
            padding: 10px;
            text-align: center;
        }

        main {
            border: 2px solid blue;
            padding: 20px;
            height: 300px;
            width: 300px;
        }
    </style>
</head>

<body>

    <section>
        <div>
            <p>Web 2 & Web×86 Infotech</p>
        </div>
    </section>

    <main>
        <img src="../Assets/Nature img.jpg"
             alt="Nature image"
             height="500px"
             width="800px">
    </main>

</body>
</html>
