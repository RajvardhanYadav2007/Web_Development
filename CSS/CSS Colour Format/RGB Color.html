<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RGBA Color</title>

    <style>
        .box1 {
            background: rgba(255, 0, 0, 0.5);
        }

        .box2 {
            background: rgba(0, 255, 0, 0.5);
        }

        .box3 {
            background: rgba(0, 0, 255, 0.5);
        }

        .box4 {
            background: rgba(255, 0, 255, 0.5);
        }
    </style>
</head>

<body>

    <div class="box1">Red Color</div>

    <div class="box2">Green Color</div>

    <div class="box3">Blue Color</div>

    <div class="box4">Purple Color</div>

</body>
</html>
