<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hex Color </title>

    <style>
        .box1 {
            background: #ff5733;
        }

        .box2 {
            background: #3498db;
        }

        .box3 {
            background: #2ecc71;
        }

        .box4 {
            background: #9b59b6;
        }
    </style>
</head>

<body>

    <div class="box1">Orange Color</div>

    <div class="box2">Blue Color</div>

    <div class="box3">Green Color</div>

    <div class="box4">Purple Color</div>

</body>
</html>
