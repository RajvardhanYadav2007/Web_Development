<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HSLA Color</title>

    <style>
        .box1 {
            background: hsla(0, 100%, 50%, 0.5);
        }

        .box2 {
            background: hsla(120, 100%, 50%, 0.5);
        }

        .box3 {
            background: hsla(240, 100%, 50%, 0.5);
        }

        .box4 {
            background: hsla(300, 100%, 50%, 0.5);
        }
    </style>
</head>

<body>

    <div class="box1">Red Color</div>

    <div class="box2">Green Color</div>

    <div class="box3">Blue Color</div>

    <div class="box4">Purple Color</div>

</body>
</html>
